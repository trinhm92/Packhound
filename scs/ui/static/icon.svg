    <path d="M384 292 C322 300 288 372 292 472 C296 580 314 652 354 698 C384 730 428 714 430 672 C434 592 432 470 426 388 C422 334 410 294 384 292 Z" fill="#0B1430" stroke="#4FF0D4" stroke-width="20"/>
    <path d="M708 556 C744 548 770 574 762 606 C756 628 728 634 708 624 C688 612 684 566 708 556 Z" fill="#4FF0D4"/>
    <circle cx="528" cy="360" r="21" fill="#4FF0D4"/>
    <g stroke="#4FF0D4" stroke-width="12">
      <rect x="262" y="770" width="64" height="34" rx="17" transform="rotate(15 294 787)"/>
      <rect x="352" y="788" width="64" height="34" rx="17" transform="rotate(5 384 805)"/>
      <rect x="442" y="786" width="64" height="34" rx="17" transform="rotate(-7 474 803)"/>
      <line x1="322" y1="794" x2="356" y2="800"/><line x1="412" y1="806" x2="446" y2="805"/>
    </g>
    <path d="M762 598 C792 608 806 638 800 660" stroke="#4FF0D4" stroke-width="12" stroke-dasharray="2 26"/>
    <g stroke="#FF5A6E" stroke-width="20">
      <path d="M650 706 L770 664 L890 706 L770 748 Z"/>
      <path d="M650 706 L650 820 L770 862 L890 820 L890 706"/>
      <path d="M770 748 V862"/>
