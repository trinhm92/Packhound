  <circle cx="846" cy="652" r="52" fill="#FF5A6E" stroke="#050913" stroke-width="12"/>
  <rect x="837" y="620" width="18" height="42" rx="9" fill="#FFFFFF"/>
  <circle cx="846" cy="680" r="10" fill="#FFFFFF"/>
