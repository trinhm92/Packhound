<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<!-- Packhound: a hound that sniffs out the bad package in your supply chain -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#11204A"/><stop offset="1" stop-color="#050913"/>
  </linearGradient>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse" x="12" y="12">
    <path d="M64 0 H0 V64" fill="none" stroke="#1E2E5C" stroke-width="3"/>
  </pattern>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
</defs>
<rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
<g clip-path="url(#tile)">
